# Alembic — the authoritative database migration runner for Atlas.
#
# Run it from anywhere with an explicit config path:
#
#     alembic -c apps/api/alembic.ini upgrade head
#     alembic -c apps/api/alembic.ini current
#     alembic -c apps/api/alembic.ini history
#
# or via the Makefile targets, which is what the docs tell people to use:
#
#     make db-upgrade      make db-current      make db-history
#
# The connection URL is deliberately NOT set here. env.py reads it from Atlas's
# own settings (ATLAS_DATABASE_URL), so a migration can never be applied to a
# different database than the application talks to. Override for a one-off with
#
#     alembic -c apps/api/alembic.ini -x url=postgresql://... upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# Timestamped, readable filenames: 2026_09_10_1432-ab12cd34_add_a_column.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
